<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Souq Sharq 360">
<title>Souq Sharq Foodcourt · Immersive Image</title>
<style>
  /* Diseño a escala 1 para iPad Pro 13" (1376×1032 en horizontal), el tamaño máximo.
     En pantallas menores --s baja de forma NO proporcional (hasta 0.75 en iPhone 16 Pro)
     para que los textos sigan siendo legibles; la maquetación se adapta para que no se pisen. */
  :root{--s:1;--lift:0px;--side:0px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#fff;
    font-family:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .screen{position:fixed;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
  body[data-s=start]  #start,
  body[data-s=adjust] #adjust,
  body[data-s=view]   #view{opacity:1;visibility:visible}

  /* logos en las esquinas (ajustes y ver) */
  .corner{position:fixed;pointer-events:none;opacity:0;transition:opacity .5s}
  body[data-s=adjust] .corner, body[data-s=view] .corner{opacity:1}
  #home{display:block;line-height:0}
  #home img{width:100%;display:block}
  #home::after{content:"";position:absolute;inset:calc(-16px*var(--s))}      /* zona táctil más grande */
  body[data-s=adjust] #home, body[data-s=view] #home{pointer-events:auto}
  #home:active{opacity:.6}
  .corner-agi{top:calc(9.6px*var(--s) + env(safe-area-inset-top));right:calc(72px*var(--s) + env(safe-area-inset-right));width:calc(65.7px*var(--s))}
  .corner-vco{bottom:calc(31.5px*var(--s) + env(safe-area-inset-bottom));right:calc(71px*var(--s) + env(safe-area-inset-right));width:calc(65.2px*var(--s))}

  /* ---------- 1 · START ---------- */
  #start{background:#bababa;pointer-events:auto;z-index:10;transition:opacity .5s ease-in-out,visibility .5s}
  #start.fade{opacity:0}
  #start .fadeout{transition:opacity .25s ease}
  #start.go .fadeout{opacity:0}
  #start{display:flex;flex-direction:column;align-items:center;
    padding:calc(42px*var(--s) + env(safe-area-inset-top)) env(safe-area-inset-right) calc(77px*var(--s) + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  #start .vco-top{flex:none;width:calc(86px*var(--s));display:block}
  #logoZone{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
    padding:min(calc(62px*var(--s)),6vh) 0 min(calc(20px*var(--s)),3vh)}
  #logo{position:relative;flex:none;width:calc(487px*var(--s));aspect-ratio:921/573}
  #logo img{position:absolute;display:block;transition:transform .5s cubic-bezier(.65,0,.35,1)}
  #bracket{left:27.144%;top:0.349%;width:72.747%}
  #letters{left:0.109%;top:37.696%;width:91.640%}
  #start .title{flex:none;text-align:center;white-space:nowrap;line-height:1.05}
  #start .title span{display:block}
  #start .t1{font-size:calc(22px*var(--s));font-weight:600;letter-spacing:.12em;text-indent:.12em}
  #start .t2{margin-top:calc(4px*var(--s));font-size:calc(16px*var(--s));font-weight:400;letter-spacing:.1em;text-indent:.1em}
  #startBtn{flex:none;margin-top:calc(39px*var(--s));width:calc(287px*var(--s));height:calc(44px*var(--s));
    border-radius:calc(22px*var(--s));font-size:calc(20px*var(--s));letter-spacing:.13em;text-indent:.13em;
    background:linear-gradient(180deg,#d3d3d3 0%,#c6c6c6 100%);
    box-shadow:0 0 0 calc(3px*var(--s)) rgba(0,0,0,.035),0 calc(3px*var(--s)) calc(8px*var(--s)) rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.06);
    text-shadow:0 1px 2px rgba(0,0,0,.08)}
  #startBtn:active{background:linear-gradient(180deg,#c9c9c9,#bebebe)}
  #startMsg{position:absolute;left:0;right:0;bottom:calc(30px*var(--s) + env(safe-area-inset-bottom));text-align:center;font-size:calc(14px*var(--s));letter-spacing:.04em;opacity:.9}

  /* ---------- 2 · AJUSTES ---------- */
  #imgSel{position:absolute;left:50%;top:49.3%;transform:translate(-50%,-50%);display:flex;gap:calc(61px*var(--s));pointer-events:auto}
  .sel{width:min(calc(290px*var(--s)),calc((100vw - 61px*var(--s) - 32px)/2));height:calc(45px*var(--s));border-radius:calc(23px*var(--s));
    border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 1px 4px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.35);
    font-size:calc(20px*var(--s));font-weight:700;letter-spacing:.14em;text-indent:.14em;
    text-shadow:0 1px 2px rgba(0,0,0,.18);transition:background .3s,border-color .3s}
  .sel.on{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.3));border-color:rgba(255,255,255,.9)}
  .sel:active{background:rgba(255,255,255,.45)}
  .item{position:absolute;left:50%;bottom:calc(111px*var(--s) + var(--lift) + env(safe-area-inset-bottom));width:calc(74px*var(--s));height:calc(74px*var(--s));
    margin-left:calc(-37px*var(--s));border-radius:50%;border:calc(2.5px*var(--s)) solid #fff}
  .item .fill{position:absolute;inset:calc(4px*var(--s));border-radius:50%;background:#fff}
  #label{position:absolute;left:0;right:0;bottom:calc(84px*var(--s) + var(--lift) + env(safe-area-inset-bottom));text-align:center;
    font-size:calc(17px*var(--s));letter-spacing:.14em;text-indent:.14em;font-variant-numeric:tabular-nums}
  #dialrow{position:absolute;left:0;right:0;bottom:calc(26px*var(--s) + var(--lift) + env(safe-area-inset-bottom));display:flex;justify-content:center;
    align-items:center;gap:clamp(8px,3vw,calc(105px*var(--s)));
    padding:0 calc(var(--side) + env(safe-area-inset-right)) 0 calc(var(--side) + env(safe-area-inset-left))}
  .txtbtn{flex:none;pointer-events:auto;font-size:calc(22px*var(--s));padding:calc(10px*var(--s)) calc(8px*var(--s));min-width:calc(84px*var(--s));transition:opacity .2s}
  #done{opacity:.55}
  #done.changed{opacity:1}
  #dial{position:relative;flex:0 1 calc(542px*var(--s));min-width:calc(120px*var(--s));height:calc(48px*var(--s));pointer-events:auto;touch-action:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
  #ticks{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(255,255,255,.92) 0 calc(1.5px*var(--s)),transparent calc(1.5px*var(--s)));
    background-size:calc(14px*var(--s)) calc(14px*var(--s));background-repeat:repeat-x;background-position-y:center}
  #needle{position:absolute;left:50%;top:50%;width:calc(2px*var(--s));height:calc(37px*var(--s));transform:translate(-50%,-50%);background:#fff;border-radius:1px}

  /* ---------- 3 · VER ---------- */
  #settingsBtn{position:absolute;left:50%;bottom:calc(21px*var(--s) + env(safe-area-inset-bottom));width:calc(55px*var(--s));height:calc(31px*var(--s));
    transform:translateX(-50%);border-radius:calc(16px*var(--s));background:rgba(232,232,232,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.1)}
  #settingsBtn svg{width:calc(30px*var(--s));height:calc(18px*var(--s))}
  #settingsBtn:active{background:rgba(210,210,210,.85)}
  #settingsBtn::after{content:"";position:absolute;inset:-12px}

  /* iPhone en horizontal: los controles dejan sitio al logo VCO de la esquina */
  @media (max-height:560px){ :root{--side:calc(150px*var(--s))} }
  /* iPhone en vertical: los controles suben por encima del logo VCO */
  @media (max-width:560px){ :root{--lift:34px;--side:8px} }

  #toast{position:fixed;left:50%;top:calc(120px*var(--s) + env(safe-area-inset-top));transform:translateX(-50%);padding:calc(8px*var(--s)) calc(16px*var(--s));
    border-radius:calc(16px*var(--s));background:rgba(0,0,0,.45);font-size:calc(14px*var(--s));letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:20;white-space:nowrap}
</style>
</head>
<body data-s="start">
<canvas id="gl"></canvas>
<button id="home" class="corner corner-agi" type="button" aria-label="Back to start"><img class="logo-agi" alt="AGI"></button>
<img class="logo-vco corner corner-vco" alt="VCO">

<!-- ================= 1 · START ================= -->
<section id="start" class="screen">
  <img class="logo-vco vco-top fadeout" alt="VCO">
  <div id="logoZone"><div id="logo"><img id="bracket" alt=""><img id="letters" alt="AGI"></div></div>
  <div class="title fadeout">
    <span class="t1">SOUQ SHARQ FOODCOURT</span>
    <span class="t2">IMMERSIVE IMAGES</span>
  </div>
  <button id="startBtn" class="fadeout" type="button">Start</button>
  <div id="startMsg" class="fadeout"></div>
</section>

<!-- ================= 2 · AJUSTES ================= -->
<section id="adjust" class="screen">
  <div id="imgSel"></div>
  <div class="item"><div class="fill"></div></div>
  <div id="label">Fov</div>
  <div id="dialrow">
    <button id="cancel" class="txtbtn" type="button">Cancel</button>
    <div id="dial"><div id="ticks"></div><div id="needle"></div></div>
    <button id="done" class="txtbtn" type="button">Done</button>
  </div>
</section>

<!-- ================= 3 · VER ================= -->
<section id="view" class="screen">
  <button id="settingsBtn" type="button" aria-label="Settings">
    <svg viewBox="0 0 40 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round">
      <line x1="7" y1="5" x2="33" y2="5"/><line x1="7" y1="12" x2="33" y2="12"/><line x1="7" y1="19" x2="33" y2="19"/>
      <circle cx="25" cy="5" r="2.8" fill="#f2f2f2"/><circle cx="14" cy="12" r="2.8" fill="#f2f2f2"/><circle cx="23" cy="19" r="2.8" fill="#f2f2f2"/>
    </svg>
  </button>
</section>

<div id="toast"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIGURACIÓN
   - images: los renders (archivo junto a index.html). "rotation" gira cada
     render en grados por si hay que alinearlo con el espacio real.
   - Los tiempos de las transiciones están en milisegundos.
   ===================================================================== */
const CONFIG = {
  images: [
    { name: '01', src: 'panorama_01.jpg', rotation: 0 },
    { name: '02', src: 'panorama_02.jpg', rotation: 0 },
  ],
  fov:        { default: 60, min: 20, max: 120, perTick: 1 },
  opacityAdjust: 0.5,      // opacidad de la imagen en la pantalla de ajustes
  adjustBackground: 1,     // fondo bajo la imagen en ajustes: 1 = blanco, 0 = negro
  fadeColor: 1,            // color de los fundidos: 1 = blanco, 0 = negro
  t: { hideStart: 250, logoOpen: 500, toBlack: 500, adjustIn: 500, imageFade: 500, toView: 400 },
  designSize: [1376, 1032],  // iPad Pro 13" en horizontal
};

const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= Escala de la interfaz ================= */
let SC = 1;
/* Escala NO proporcional: va de 0.75 (lado corto de 402 px, iPhone 16 Pro) a 1 (lado corto
   de 1032 px, iPad Pro 13"). Así en el móvil los textos no quedan diminutos. */
const SCALE_MIN = { side: 402, s: 0.75 }, SCALE_MAX = { side: 1032, s: 1 };
function updateScale() {
  const short = Math.min(innerWidth, innerHeight);
  const k = clamp((short - SCALE_MIN.side) / (SCALE_MAX.side - SCALE_MIN.side), 0, 1);
  SC = SCALE_MIN.s + (SCALE_MAX.s - SCALE_MIN.s) * k;
  document.documentElement.style.setProperty('--s', SC.toFixed(4));
  fitLogo();
}
// El logo de Start se encoge si no cabe en el hueco disponible (p. ej. iPhone en horizontal)
function fitLogo() {
  const zone = document.getElementById('logoZone'), logo = document.getElementById('logo');
  if (!zone || !logo || document.getElementById('start').classList.contains('go')) return;
  const cs = getComputedStyle(zone);
  const availH = zone.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const w = Math.min(487 * SC, innerWidth * 0.86, availH * 0.92 * 921 / 573);
  logo.style.width = Math.max(60, w) + 'px';
}
// Márgenes seguros (notch / Dynamic Island / barra de inicio)
function safeInsets() {
  const p = document.createElement('div');
  p.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(p);
  const cs = getComputedStyle(p), r = {t: parseFloat(cs.paddingTop)||0, r: parseFloat(cs.paddingRight)||0, b: parseFloat(cs.paddingBottom)||0, l: parseFloat(cs.paddingLeft)||0};
  p.remove(); return r;
}
updateScale();

/* ================= Estado ================= */
const STORE = 'visor360-v2';
const P = { fov: CONFIG.fov.default, img: 0 };
try { Object.assign(P, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
P.img = clamp(P.img | 0, 0, CONFIG.images.length - 1);
function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {} }

const S = {
  screen: 'start', shown: P.img,
  ori: null, sensorOn: false, listening: false,
  calibPending: false, calibPhi: 0, touchYaw: 0, touchPitch: 0,
  look: { op: CONFIG.opacityAdjust, lvl: 0 },   // op = opacidad sobre el fondo, lvl = fundido a negro
};

/* ================= WebGL ================= */
const canvas = $('gl');
let gl = canvas.getContext('webgl2', {antialias:false, alpha:false});
const GL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', {antialias:false, alpha:false});
if (!gl) { $('startMsg').textContent = 'This browser does not support WebGL.'; return; }

const VS = GL2 ? '#version 300 es\nin vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}'
               : 'attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}';
const FS_COMMON = `
uniform sampler2D uTex;
uniform mat3 uRot;     // cámara -> mundo (x=Este, y=Norte, z=Arriba)
uniform vec2 uTan;     // tan(fovH/2), tan(fovV/2)
uniform float uYaw;    // giro del render (rad)
uniform vec2 uRes;
uniform float uOpacity; // opacidad de la imagen sobre el fondo
uniform float uBg;      // fondo: 1 blanco, 0 negro
uniform float uLevel;   // fundido (0 = color de fundido, 1 = imagen)
uniform float uFadeC;   // color del fundido: 1 blanco, 0 negro
const float PI = 3.14159265359;
vec2 dirToUV(){
  vec2 p = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec3 d = normalize(uRot * vec3(p.x * uTan.x, p.y * uTan.y, -1.0));
  float lon = atan(d.x, d.y) + uYaw;
  float lat = asin(clamp(d.z, -1.0, 1.0));
  return vec2(fract(lon / (2.0 * PI) + 0.5), 0.5 - lat / PI);
}`;
const FS = GL2 ? `#version 300 es
precision highp float;${FS_COMMON}
out vec4 outColor;
void main(){
  vec2 uv = dirToUV();
  vec2 dx = dFdx(uv), dy = dFdy(uv);
  dx.x -= floor(dx.x + 0.5); dy.x -= floor(dy.x + 0.5);   // evita la costura vertical
  outColor = vec4(mix(vec3(uFadeC), mix(vec3(uBg), textureGrad(uTex, uv, dx, dy).rgb, uOpacity), uLevel), 1.0);
}` : `precision highp float;${FS_COMMON}
void main(){ gl_FragColor = vec4(mix(vec3(uFadeC), mix(vec3(uBg), texture2D(uTex, dirToUV()).rgb, uOpacity), uLevel), 1.0); }`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(prog, 0, 'aPos');
gl.linkProgram(prog);
gl.useProgram(prog);
const U = {};
['uTex','uRot','uTan','uYaw','uRes','uOpacity','uBg','uLevel','uFadeC'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.uniform1i(U.uTex, 0);
gl.activeTexture(gl.TEXTURE0);

function makeTexture(src) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (GL2) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    const an = gl.getExtension('EXT_texture_filter_anisotropic') || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
    if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  return tex;
}

/* ================= Carga de los renders ================= */
const textures = [];                 // una textura por imagen (se comparten si el archivo es el mismo)
const bySrc = {};
async function loadImage(src) {
  const img = new Image();
  if (/^https?:/i.test(src)) img.crossOrigin = 'anonymous';
  img.src = src;
  await (img.decode ? img.decode() : new Promise((r, j) => { img.onload = r; img.onerror = j; }));
  let out = img;
  const limit = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 8192);
  if (img.naturalWidth > limit) {
    const tw = limit, th = Math.round(limit * img.naturalHeight / img.naturalWidth);
    try { out = await createImageBitmap(img, {resizeWidth: tw, resizeHeight: th, resizeQuality: 'high'}); }
    catch (e) {
      const c = document.createElement('canvas'); c.width = 4096; c.height = Math.round(4096 * th / tw);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); out = c;
    }
  }
  return makeTexture(out);
}
function loadAll() {
  CONFIG.images.forEach((im, i) => {
    bySrc[im.src] = bySrc[im.src] || loadImage(im.src);
    bySrc[im.src].then(t => { textures[i] = t; })
      .catch(() => { $('startMsg').textContent = `Could not load “${im.src}”. Check that it is uploaded next to index.html.`; });
  });
}

/* ================= Orientación del dispositivo ================= */
function deviceToWorld(a, b, g, scr) {
  const cA = Math.cos(a*D2R), sA = Math.sin(a*D2R), cB = Math.cos(b*D2R), sB = Math.sin(b*D2R);
  const cG = Math.cos(g*D2R), sG = Math.sin(g*D2R);
  const c0 = [cA*cG - sA*sB*sG, cG*sA + cA*sB*sG, -cB*sG];      // R = Rz(α)·Rx(β)·Ry(γ)
  const c1 = [-cB*sA, cA*cB, sB];
  const c2 = [cA*sG + cG*sA*sB, sA*sG - cA*cG*sB, cB*cG];
  const t = -scr * D2R, ct = Math.cos(t), st = Math.sin(t);       // compensa el giro de la interfaz
  return [[c0[0]*ct + c1[0]*st, c0[1]*ct + c1[1]*st, c0[2]*ct + c1[2]*st],
          [-c0[0]*st + c1[0]*ct, -c0[1]*st + c1[1]*ct, -c0[2]*st + c1[2]*ct], c2];
}
const LEVEL = [[1,0,0],[0,0,1],[0,-1,0]];          // iPad vertical mirando al frente
function rotZ(m, p) { const c = Math.cos(p), s = Math.sin(p); return m.map(v => [v[0]*c - v[1]*s, v[0]*s + v[1]*c, v[2]]); }
function pitchLocal(m, p) {
  const c = Math.cos(p), s = Math.sin(p);
  return [m[0], [0,1,2].map(i => c*m[1][i] + s*m[2][i]), [0,1,2].map(i => c*m[2][i] - s*m[1][i])];
}
/* Giro de la interfaz. En iPad, screen.orientation.angle no siempre es fiable:
   se usa window.orientation y, si no cuadra con la forma de la pantalla, se deduce de la gravedad. */
const IS_IOS = !!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
            || /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let scrFix = null;
const resetScrFix = () => { scrFix = null; };
addEventListener('orientationchange', resetScrFix);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', resetScrFix);
function norm(a) { a = ((Math.round(a) % 360) + 360) % 360; return a === 270 ? -90 : a; }
function inferAngle(landscape) {
  const o = S.ori; if (!o) return null;
  const R = deviceToWorld(o.a, o.b, o.g, 0);
  const xz = R[0][2], yz = R[1][2];
  if (landscape) return Math.abs(xz) < 0.4 ? null : (xz > 0 ? 90 : -90);
  return Math.abs(yz) < 0.4 ? null : (yz > 0 ? 0 : 180);
}
function screenAngle() {
  let a = typeof window.orientation === 'number' ? window.orientation
        : (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : 0;
  a = norm(a);
  if (IS_IOS) {
    const landscapeLayout = innerWidth > innerHeight;
    if (landscapeLayout !== (Math.abs(a) === 90)) {
      if (scrFix === null) scrFix = inferAngle(landscapeLayout);
      if (scrFix !== null) a = scrFix;
    } else scrFix = null;
  }
  return a;
}
function baseCols() {
  return (S.sensorOn && S.ori) ? deviceToWorld(S.ori.a, S.ori.b, S.ori.g, screenAngle()) : LEVEL;
}
// La dirección a la que apunta el iPad ahora pasa a ser el centro del render
function calibrate() {
  S.touchYaw = 0; S.touchPitch = 0;
  if (!S.sensorOn) { S.calibPhi = 0; S.calibPending = S.listening; return; }
  const m = baseCols();
  S.calibPhi = Math.atan2(-m[2][0], -m[2][1]);
  S.calibPending = false;
}
function onOri(e) {
  if (e.alpha == null && e.beta == null) return;
  S.ori = {a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0};
  S.sensorOn = true;
  if (S.calibPending) calibrate();
}
function askMotion() {                     // tiene que llamarse dentro de un toque (iOS)
  const add = () => { if (!S.listening) { addEventListener('deviceorientation', onOri); S.listening = true; } return true; };
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return Promise.resolve(false);
  if (typeof DOE.requestPermission === 'function')
    return DOE.requestPermission().then(r => r === 'granted' ? add() : false).catch(() => false);
  return Promise.resolve(add());
}

/* ================= Fundidos de la imagen ================= */
let anim = null;
function animTo(target, ms) {             // target: {op?, lvl?}
  return new Promise(res => {
    if (anim) anim.res();
    const from = Object.assign({}, S.look), to = Object.assign({}, S.look, target);
    anim = {from, to, t0: performance.now(), ms: Math.max(1, ms), res};
  });
}
function stepAnim(now) {
  if (!anim) return;
  const a = anim, k = Math.min(1, (now - a.t0) / a.ms);
  const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
  S.look.op  = a.from.op  + (a.to.op  - a.from.op)  * e;
  S.look.lvl = a.from.lvl + (a.to.lvl - a.from.lvl) * e;
  if (k >= 1) { anim = null; a.res(); }
}
const opFor = scr => scr === 'view' ? 1 : CONFIG.opacityAdjust;

/* Muestra el render i con la opacidad de la pantalla actual.
   Si cambia de render: fundido a blanco → cambio → vuelta (0,5 s + 0,5 s). */
let queue = Promise.resolve(), gen = 0;
function showImage(i) {
  const g = gen;
  queue = queue.then(async () => {
    if (g !== gen) return;
    if (i !== S.shown) {
      await animTo({lvl: 0}, CONFIG.t.imageFade);
      if (g !== gen) return;
      S.shown = i;
      S.look.op = opFor(S.screen);
      await animTo({lvl: 1}, CONFIG.t.imageFade);
    } else {
      await animTo({op: opFor(S.screen), lvl: 1}, S.look.lvl < 1 ? CONFIG.t.adjustIn : CONFIG.t.toView);
    }
  });
  return queue;
}

/* ================= Pantallas ================= */
let snapshot = null;
function setScreen(s) { S.screen = s; document.body.dataset.s = s; }

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen !== 'start') keepAwake(); });

let starting = false;
$('startBtn').addEventListener('click', async () => {
  if (starting) return; starting = true;
  const motion = askMotion();                       // dentro del toque, como pide iOS
  keepAwake();
  const st = $('start');

  // 1) desaparece todo menos el logo central
  st.classList.add('go');
  await wait(CONFIG.t.hideStart);

  // 2) el logo se abre hacia las esquinas
  const br = $('bracket'), le = $('letters');
  const rb = br.getBoundingClientRect(), rl = le.getBoundingClientRect();
  const ins = safeInsets();
  br.style.transform = `translate(${innerWidth - ins.r - 70.5*SC - rb.right}px, ${ins.t + 50.7*SC - rb.top}px)`;   // esquina sup. dcha.
  le.style.transform = `translate(${ins.l + 68.9*SC - rl.left}px, ${innerHeight - ins.b - 49.1*SC - rl.bottom}px)`; // esquina inf. izda.
  // 3) a la vez, funde a blanco
  st.classList.add('fade');
  await wait(Math.max(CONFIG.t.logoOpen, CONFIG.t.toBlack) + 60);
  if (!starting) return;                          // se volvió a Start a mitad de la animación

  // 4) aparece la pantalla de ajustes con la imagen al 50 %
  const ok = await motion;
  calibrate();
  S.shown = P.img;
  openAdjust();
  if (!ok) toast('Motion sensors unavailable · drag to look around');
  else setTimeout(() => { if (!S.sensorOn) toast('No gyroscope data · drag to look around'); }, 1500);
});

function goHome() {
  if (S.screen === 'adjust' && snapshot) Object.assign(P, snapshot);   // como Cancel
  starting = false;
  if (anim) { anim.res(); anim = null; }
  S.look = { op: CONFIG.opacityAdjust, lvl: 0 };
  gen++; queue = Promise.resolve();
  S.shown = P.img;
  const st = $('start'), br = $('bracket'), le = $('letters');
  // devuelve el logo a su sitio sin animación
  [br, le].forEach(el => { el.style.transition = 'none'; el.style.transform = ''; });
  st.classList.remove('go', 'fade');
  fitLogo();
  void st.offsetWidth;
  [br, le].forEach(el => { el.style.transition = ''; });
  clearTimeout(toastT); $('toast').style.opacity = 0;
  setScreen('start');
}
$('home').addEventListener('click', goHome);

function openAdjust() {
  snapshot = Object.assign({}, P);
  setScreen('adjust');
  renderSel(); renderDial(); refreshDone();
  $('label').textContent = 'Fov';
  showImage(P.img);
}
$('settingsBtn').addEventListener('click', openAdjust);
$('cancel').addEventListener('click', () => {
  Object.assign(P, snapshot);
  setScreen('view');
  showImage(P.img);
});
$('done').addEventListener('click', () => {
  save();
  setScreen('view');
  showImage(P.img);
});
function refreshDone() {
  const changed = snapshot && (Math.abs(P.fov - snapshot.fov) > 1e-6 || P.img !== snapshot.img);
  $('done').classList.toggle('changed', !!changed);
}

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 2600); }

/* ================= Selector de imagen 01 / 02 ================= */
const selBox = $('imgSel');
const sels = CONFIG.images.map((im, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sel'; b.textContent = 'IMAGE ' + im.name;
  b.addEventListener('click', () => {
    if (P.img === i) return;
    P.img = i; renderSel(); refreshDone();
    showImage(i);
  });
  selBox.appendChild(b);
  return b;
});
function renderSel() { sels.forEach((b, i) => b.classList.toggle('on', i === P.img)); }

/* ================= Slider de rayas (FOV) ================= */
const dial = $('dial'), ticks = $('ticks'), label = $('label');
const F = CONFIG.fov;
let labelT;
function renderDial() {
  const tickPx = 14 * SC;
  const off = -((P.fov - F.min) / F.perTick) * tickPx;
  ticks.style.backgroundPositionX = (dial.clientWidth / 2 - 0.75 * SC + off) + 'px';
}
function setFov(v) { P.fov = clamp(v, F.min, F.max); renderDial(); refreshDone(); }
let dialDrag = null, lastDialTap = 0;
dial.addEventListener('pointerdown', e => {
  dialDrag = {x: e.clientX, v: P.fov, id: e.pointerId, moved: false};
  try { dial.setPointerCapture(e.pointerId); } catch (_) {}
});
dial.addEventListener('pointermove', e => {
  if (!dialDrag || e.pointerId !== dialDrag.id) return;
  const dx = e.clientX - dialDrag.x;
  if (Math.abs(dx) > 2) dialDrag.moved = true;
  setFov(dialDrag.v - dx / (14 * SC) * F.perTick);
  clearTimeout(labelT);
  label.textContent = `Fov  ${Math.round(P.fov)}°`;
});
const dialUp = e => {
  if (!dialDrag || e.pointerId !== dialDrag.id) return;
  const moved = dialDrag.moved; dialDrag = null;
  if (!moved) {                                   // doble toque en el slider = valor por defecto
    const now = performance.now();
    if (now - lastDialTap < 320) { setFov(F.default); label.textContent = `Fov  ${Math.round(P.fov)}°`; }
    lastDialTap = now;
  }
  clearTimeout(labelT); labelT = setTimeout(() => label.textContent = 'Fov', 1100);
};
dial.addEventListener('pointerup', dialUp);
dial.addEventListener('pointercancel', dialUp);

/* ================= Mirar con el dedo ================= */
let look = null, lastTap = {t: 0, x: 0, y: 0};
canvas.addEventListener('pointerdown', e => {
  if (S.screen === 'start' || look) return;
  look = {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, id: e.pointerId};
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!look || e.pointerId !== look.id) return;
  const k = P.fov * D2R / canvas.clientHeight;
  S.touchYaw   += (e.clientX - look.x) * k;
  S.touchPitch  = clamp(S.touchPitch + (e.clientY - look.y) * k, -80 * D2R, 80 * D2R);

const lookUp = e => {
  if (!look || e.pointerId !== look.id) return;
  const tap = Math.hypot(e.clientX - look.x0, e.clientY - look.y0) < 10;
  look = null;
  if (!tap) return;
  const now = performance.now();
  if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
    calibrate(); toast('Recentered'); lastTap.t = 0;     // doble toque = recentrar
  } else lastTap = {t: now, x: e.clientX, y: e.clientY};
};
canvas.addEventListener('pointerup', lookUp);
canvas.addEventListener('pointercancel', lookUp);

/* ================= Render ================= */
const rot = new Float32Array(9);
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
addEventListener('resize', () => { updateScale(); resize(); renderDial(); });
function frame(now) {
  requestAnimationFrame(frame);
  stepAnim(now);
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  const tex = textures[S.shown];
  if (S.screen === 'start' || !tex || S.look.lvl <= 0.001) { const c = CONFIG.fadeColor; gl.clearColor(c, c, c, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
  const m = pitchLocal(rotZ(baseCols(), S.calibPhi + S.touchYaw), S.touchPitch);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) rot[i*3 + j] = m[i][j];
  const tv = Math.tan(P.fov * D2R / 2), asp = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniformMatrix3fv(U.uRot, false, rot);
  gl.uniform2f(U.uTan, tv * asp, tv);
  gl.uniform1f(U.uYaw, (CONFIG.images[S.shown].rotation || 0) * D2R);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uOpacity, S.look.op);
  gl.uniform1f(U.uBg, CONFIG.adjustBackground);
  gl.uniform1f(U.uLevel, S.look.lvl);
  gl.uniform1f(U.uFadeC, CONFIG.fadeColor);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ================= Inicio ================= */
updateScale();
if (!window.isSecureContext)
  $('startMsg').textContent = 'Open this page from an https:// address to enable the gyroscope.';
loadAll();
requestAnimationFrame(frame);
})();
</script>
