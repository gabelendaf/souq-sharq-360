<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Souq Sharq 360">
<title>Souq Sharq Foodcourt · Immersive Image</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#fff;
    font-family:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .screen{position:fixed;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
  body[data-s=start]  #start,
  body[data-s=adjust] #adjust,
  body[data-s=view]   #view{opacity:1;visibility:visible}

  /* velo blanco de la pantalla de ajustes */
  #wash{position:fixed;inset:0;background:rgba(255,255,255,.34);pointer-events:none;opacity:0;transition:opacity .4s}
  body[data-s=adjust] #wash{opacity:1}

  /* logos en las esquinas (ajustes y ver) */
  .corner-agi{position:fixed;top:calc(24px + env(safe-area-inset-top));right:calc(32px + env(safe-area-inset-right));width:80px;pointer-events:none}
  .corner-vco{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:calc(32px + env(safe-area-inset-right));width:76px;pointer-events:none}

  /* ---------- START ---------- */
  #start{background:#bababa;pointer-events:auto;z-index:10}
  #start .vco-top{position:absolute;left:50%;top:calc(42px + env(safe-area-inset-top));width:86px;transform:translateX(-50%)}
  #start .agi-big{position:absolute;left:50%;top:47%;width:min(487px,52vw,58vh);transform:translate(-50%,-50%)}
  #start .title{position:absolute;left:0;right:0;top:77%;text-align:center;font-size:22px;line-height:1.35;
    letter-spacing:.13em;font-weight:400}
  #start .title span{display:block}
  #startBtn{position:absolute;left:50%;top:90.5%;width:287px;height:44px;transform:translate(-50%,-50%);
    border-radius:22px;font-size:20px;letter-spacing:.13em;text-indent:.13em;
    background:linear-gradient(180deg,#d3d3d3 0%,#c6c6c6 100%);
    box-shadow:0 0 0 3px rgba(0,0,0,.035),0 3px 8px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.06);
    text-shadow:0 1px 2px rgba(0,0,0,.08)}
  #startBtn:active{background:linear-gradient(180deg,#c9c9c9,#bebebe)}
  #startMsg{position:absolute;left:0;right:0;top:calc(90.5% + 34px);text-align:center;font-size:14px;letter-spacing:.04em;opacity:.9}

  /* ---------- AJUSTES ---------- */
  #carousel{position:absolute;left:50%;bottom:calc(106px + env(safe-area-inset-bottom));width:460px;height:84px;margin-left:-230px;
    pointer-events:auto;touch-action:none}
  .item{position:absolute;left:50%;top:5px;width:74px;height:74px;margin-left:-37px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.96);box-shadow:0 1px 6px rgba(0,0,0,.06)}
  .item .fill{position:absolute;inset:4px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .22s ease}
  .item svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .18s}
  .item.on .fill{transform:scale(1)}
  .item.on svg{opacity:0}
  #label{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));text-align:center;
    font-size:17px;letter-spacing:.14em;text-indent:.14em;text-shadow:0 1px 3px rgba(0,0,0,.18);transition:opacity .18s;
    font-variant-numeric:tabular-nums}
  #dialrow{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;justify-content:center;
    align-items:center;gap:clamp(24px,7vw,105px)}
  .txtbtn{pointer-events:auto;font-size:22px;padding:10px 12px;min-width:96px;text-shadow:0 1px 3px rgba(0,0,0,.15);transition:opacity .2s}
  #done{opacity:.55}
  #done.changed{opacity:1}
  #dial{position:relative;width:min(542px,50vw);height:48px;pointer-events:auto;touch-action:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
  #ticks{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(255,255,255,.92) 0 1.5px,transparent 1.5px);
    background-size:14px 14px;background-repeat:repeat-x;background-position-y:center}
  #needle{position:absolute;left:50%;top:50%;width:2px;height:37px;margin:-18.5px 0 0 -1px;background:#fff;border-radius:1px;
    box-shadow:0 0 3px rgba(0,0,0,.15)}

  /* ---------- VER ---------- */
  #settingsBtn{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:76px;height:44px;margin-left:-38px;
    border-radius:22px;background:rgba(232,232,232,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.1)}
  #settingsBtn:active{background:rgba(210,210,210,.85)}

  #toast{position:fixed;left:50%;top:calc(24px + env(safe-area-inset-top));transform:translateX(-50%);padding:8px 16px;border-radius:16px;
    background:rgba(0,0,0,.4);font-size:14px;letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:20}
</style>
</head>
<body data-s="start">
<canvas id="gl"></canvas>
<div id="wash"></div>
<img class="logo-agi corner-agi" alt="AGI">
<img class="logo-vco corner-vco" alt="VCO">

<!-- ================= 1 · START ================= -->
<section id="start" class="screen">
  <img class="logo-vco vco-top" alt="VCO">
  <img class="logo-agi agi-big" alt="AGI">
  <div class="title">
    <span>SOUQ SHARQ FOODCOURT</span>
    <span>IMMERSIVE IMAGE</span>
  </div>
  <button id="startBtn" type="button">Start</button>
  <div id="startMsg"></div>
</section>

<!-- ================= 2 · AJUSTES ================= -->
<section id="adjust" class="screen">
  <div id="carousel"></div>
  <div id="label"></div>
  <div id="dialrow">
    <button id="cancel" class="txtbtn" type="button">Cancel</button>
    <div id="dial"><div id="ticks"></div><div id="needle"></div></div>
    <button id="done" class="txtbtn" type="button">Done</button>
  </div>
</section>

<!-- ================= 3 · VER ================= -->
<section id="view" class="screen">
  <button id="settingsBtn" type="button" aria-label="Settings">
    <svg width="40" height="24" viewBox="0 0 40 24" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round">
      <line x1="7" y1="5" x2="33" y2="5"/><line x1="7" y1="12" x2="33" y2="12"/><line x1="7" y1="19" x2="33" y2="19"/>
      <circle cx="25" cy="5" r="2.8" fill="#f2f2f2"/><circle cx="14" cy="12" r="2.8" fill="#f2f2f2"/><circle cx="23" cy="19" r="2.8" fill="#f2f2f2"/>
    </svg>
  </button>
</section>

<div id="toast"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIGURACIÓN — cambia aquí la imagen o los valores por defecto
   (también puedes abrir la página con ?img=otro_render.jpg)
   ===================================================================== */
const CONFIG = {
  image: new URLSearchParams(location.search).get('img') || 'panorama.jpg',
  defaults: { exposure: 0, fov: 60, saturation: 1, rotation: 0 },
};

/* Ajustes del carrusel. "tick" = cuánto cambia el valor por cada raya del slider. */
const SETTINGS = [
  { key:'exposure',   label:'Exposure',   min:-2,   max:2,   tick:0.05,
    fmt:v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' EV',
    icon:`<circle cx="37" cy="37" r="12.5" stroke="#fff" stroke-width="1.8" fill="none"/>
          <path d="M37 28.6v6.2M33.9 31.7h6.2M33.9 42.3h6.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>` },
  { key:'fov',        label:'Fov',        min:20,   max:120, tick:1,
    fmt:v => Math.round(v) + '°',
    icon:`<path d="M37 46 L26.5 29.5 M37 46 L47.5 29.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M26.5 29.5 Q37 23 47.5 29.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>` },
  { key:'saturation', label:'Saturation', min:0,    max:2,   tick:0.02,
    fmt:v => (v >= 1 ? '+' : '−') + Math.abs(Math.round((v - 1) * 100)) + '%',
    icon:`<defs><clipPath id="satL"><path d="M37 24.5 A12.5 12.5 0 0 0 37 49.5 Z"/></clipPath></defs>
          <path d="M37 24.5 A12.5 12.5 0 0 1 37 49.5 Z" fill="#fff"/>
          <g clip-path="url(#satL)" stroke="#fff" stroke-width="1.3">
            <line x1="22" y1="27" x2="38" y2="27"/><line x1="22" y1="30" x2="38" y2="30"/><line x1="22" y1="33" x2="38" y2="33"/>
            <line x1="22" y1="36" x2="38" y2="36"/><line x1="22" y1="39" x2="38" y2="39"/><line x1="22" y1="42" x2="38" y2="42"/>
            <line x1="22" y1="45" x2="38" y2="45"/><line x1="22" y1="48" x2="38" y2="48"/></g>
          <circle cx="37" cy="37" r="12.5" stroke="#fff" stroke-width="1.8" fill="none"/>` },
  { key:'rotation',   label:'Rotation',   min:-180, max:180, tick:1, wrap:true,
    fmt:v => Math.round(v) + '°',
    icon:`<path d="M45.8 30.8 A11 11 0 1 0 48 38" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M47.6 25.6 L46.6 32.4 L40.2 30.2 Z" fill="#fff"/>` },
];
const ITEM_GAP = 107;   // separación entre círculos (px)
const TICK_PX  = 14;    // separación entre rayas del slider (px)

const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wrap180 = d => ((d + 180) % 360 + 360) % 360 - 180;

/* ================= Estado y guardado ================= */
const STORE = 'visor360:' + CONFIG.image;
const P = Object.assign({}, CONFIG.defaults);
try { Object.assign(P, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {} }

const S = {
  screen: 'start',
  ori: null, sensorOn: false, listening: false,
  calibPending: false, calibPhi: 0,
  touchYaw: 0, touchPitch: 0,
  imgReady: false,
};

/* ================= WebGL ================= */
const canvas = $('gl');
let gl = canvas.getContext('webgl2', {antialias:false, alpha:false});
const GL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', {antialias:false, alpha:false});
if (!gl) { $('startMsg').textContent = 'This browser does not support WebGL.'; return; }

const VS = GL2 ? '#version 300 es\nin vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}'
               : 'attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}';
const FS_COMMON = `
uniform sampler2D uTex;
uniform mat3 uRot;     // cámara -> mundo (x=Este, y=Norte, z=Arriba)
uniform vec2 uTan;     // tan(fovH/2), tan(fovV/2)
uniform float uYaw;    // giro de la imagen (rad)
uniform vec2 uRes;
uniform float uExp;    // 2^EV
uniform float uSat;
const float PI = 3.14159265359;
vec2 dirToUV(){
  vec2 p = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec3 d = normalize(uRot * vec3(p.x * uTan.x, p.y * uTan.y, -1.0));
  float lon = atan(d.x, d.y) + uYaw;
  float lat = asin(clamp(d.z, -1.0, 1.0));
  return vec2(fract(lon / (2.0 * PI) + 0.5), 0.5 - lat / PI);
}
vec3 grade(vec3 c){
  c = pow(max(c, 0.0), vec3(2.2)) * uExp;
  c = pow(c, vec3(1.0 / 2.2));
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  return clamp(mix(vec3(l), c, uSat), 0.0, 1.0);
}`;
const FS = GL2 ? `#version 300 es
precision highp float;${FS_COMMON}
out vec4 outColor;
void main(){
  vec2 uv = dirToUV();
  vec2 dx = dFdx(uv), dy = dFdy(uv);
  dx.x -= floor(dx.x + 0.5); dy.x -= floor(dy.x + 0.5);   // evita la costura vertical
  outColor = vec4(grade(textureGrad(uTex, uv, dx, dy).rgb), 1.0);
}` : `precision highp float;${FS_COMMON}
void main(){ gl_FragColor = vec4(grade(texture2D(uTex, dirToUV()).rgb), 1.0); }`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(prog, 0, 'aPos');
gl.linkProgram(prog);
gl.useProgram(prog);
const U = {};
['uTex','uRot','uTan','uYaw','uRes','uExp','uSat'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.uniform1i(U.uTex, 0);

const tex = gl.createTexture();
function uploadTexture(src) {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (GL2) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    const an = gl.getExtension('EXT_texture_filter_anisotropic') || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
    if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
}

/* ================= Carga del render 360 ================= */
async function loadPanorama() {
  const img = new Image();
  if (/^https?:/i.test(CONFIG.image)) img.crossOrigin = 'anonymous';
  img.src = CONFIG.image;
  try {
    await (img.decode ? img.decode() : new Promise((r, j) => { img.onload = r; img.onerror = j; }));
  } catch (e) {
    $('startMsg').textContent = `Could not load “${CONFIG.image}”. Check that it is uploaded next to index.html.`;
    return;
  }
  let src = img;
  const limit = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 8192);
  if (img.naturalWidth > limit) {
    const tw = limit, th = Math.round(limit * img.naturalHeight / img.naturalWidth);
    try { src = await createImageBitmap(img, {resizeWidth: tw, resizeHeight: th, resizeQuality: 'high'}); }
    catch (e) {
      const c = document.createElement('canvas'); c.width = 4096; c.height = Math.round(4096 * th / tw);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); src = c;
    }
  }
  uploadTexture(src);
  S.imgReady = true;
}

/* ================= Orientación del dispositivo ================= */
function deviceToWorld(a, b, g, scr) {
  const cA = Math.cos(a*D2R), sA = Math.sin(a*D2R), cB = Math.cos(b*D2R), sB = Math.sin(b*D2R);
  const cG = Math.cos(g*D2R), sG = Math.sin(g*D2R);
  const c0 = [cA*cG - sA*sB*sG, cG*sA + cA*sB*sG, -cB*sG];      // R = Rz(α)·Rx(β)·Ry(γ)
  const c1 = [-cB*sA, cA*cB, sB];
  const c2 = [cA*sG + cG*sA*sB, sA*sG - cA*cG*sB, cB*cG];
  const t = -scr * D2R, ct = Math.cos(t), st = Math.sin(t);       // compensa el giro de la interfaz
  return [[c0[0]*ct + c1[0]*st, c0[1]*ct + c1[1]*st, c0[2]*ct + c1[2]*st],
          [-c0[0]*st + c1[0]*ct, -c0[1]*st + c1[1]*ct, -c0[2]*st + c1[2]*ct], c2];
}
const LEVEL = [[1,0,0],[0,0,1],[0,-1,0]];          // iPad vertical mirando al frente
function rotZ(m, p) { const c = Math.cos(p), s = Math.sin(p); return m.map(v => [v[0]*c - v[1]*s, v[0]*s + v[1]*c, v[2]]); }
function pitchLocal(m, p) {
  const c = Math.cos(p), s = Math.sin(p);
  return [m[0], [0,1,2].map(i => c*m[1][i] + s*m[2][i]), [0,1,2].map(i => c*m[2][i] - s*m[1][i])];
}
/* Giro de la interfaz respecto a la posición natural (vertical) del iPad.
   En iPad, screen.orientation.angle no siempre es fiable: se usa window.orientation
   y, si aun así no cuadra con la forma de la pantalla, se deduce de la gravedad. */
const IS_IOS = !!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
            || /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let scrFix = null;
const resetScrFix = () => { scrFix = null; };
addEventListener('orientationchange', resetScrFix);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', resetScrFix);
function norm(a) { a = ((Math.round(a) % 360) + 360) % 360; return a === 270 ? -90 : a; }
function inferAngle(landscape) {
  const o = S.ori; if (!o) return null;
  const R = deviceToWorld(o.a, o.b, o.g, 0);          // ejes del dispositivo sin compensar
  const xz = R[0][2], yz = R[1][2];                    // cuánto apunta hacia arriba cada eje
  if (landscape) return Math.abs(xz) < 0.4 ? null : (xz > 0 ? 90 : -90);
  return Math.abs(yz) < 0.4 ? null : (yz > 0 ? 0 : 180);
}
function screenAngle() {
  let a = typeof window.orientation === 'number' ? window.orientation
        : (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : 0;
  a = norm(a);
  if (IS_IOS) {
    const landscapeLayout = innerWidth > innerHeight;
    if (landscapeLayout !== (Math.abs(a) === 90)) {
      if (scrFix === null) scrFix = inferAngle(landscapeLayout);
      if (scrFix !== null) a = scrFix;
    } else scrFix = null;
  }
  return a;
}
function baseCols() {
  return (S.sensorOn && S.ori) ? deviceToWorld(S.ori.a, S.ori.b, S.ori.g, screenAngle()) : LEVEL;
}
// La dirección a la que apunta el iPad ahora pasa a ser el centro de la imagen
function calibrate() {
  S.touchYaw = 0; S.touchPitch = 0;
  if (!S.sensorOn) { S.calibPhi = 0; S.calibPending = S.listening; return; }
  const m = baseCols();
  S.calibPhi = Math.atan2(-m[2][0], -m[2][1]);
  S.calibPending = false;
}
function onOri(e) {
  if (e.alpha == null && e.beta == null) return;
  S.ori = {a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0};
  S.sensorOn = true;
  if (S.calibPending) calibrate();
}
function askMotion() {                     // tiene que llamarse dentro de un toque (iOS)
  const add = () => { if (!S.listening) { addEventListener('deviceorientation', onOri); S.listening = true; } return true; };
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return Promise.resolve(false);
  if (typeof DOE.requestPermission === 'function')
    return DOE.requestPermission().then(r => r === 'granted' ? add() : false).catch(() => false);
  return Promise.resolve(add());
}

/* ================= Pantallas ================= */
let snapshot = null;
function setScreen(s) { S.screen = s; document.body.dataset.s = s; }

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen !== 'start') keepAwake(); });

$('startBtn').addEventListener('click', () => {
  const p = askMotion();
  keepAwake();
  p.then(ok => {
    calibrate();
    openAdjust();
    if (!ok) toast('Motion sensors unavailable · drag to look around');
    else setTimeout(() => { if (!S.sensorOn) toast('No gyroscope data · drag to look around'); }, 1500);
  });
});
function openAdjust() {
  snapshot = Object.assign({}, P);
  setScreen('adjust');
  goTo(active, false);
  showLabelName();
  refreshDone();
}
$('settingsBtn').addEventListener('click', openAdjust);
$('cancel').addEventListener('click', () => { Object.assign(P, snapshot); renderDial(); setScreen('view'); });
$('done').addEventListener('click', () => { save(); setScreen('view'); });
function refreshDone() {
  const changed = snapshot && SETTINGS.some(s => Math.abs(P[s.key] - snapshot[s.key]) > 1e-6);
  $('done').classList.toggle('changed', !!changed);
}

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 2600); }

/* ================= Carrusel de ajustes ================= */
const car = $('carousel');
const items = SETTINGS.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'item';

let active = 1;           // empieza en Fov

let carAnim = 0;
function renderCarousel() {

const rot = new Float32Array(9);

  gl.uniform1f(U.uSat, P.saturation);

  $('startMsg').textContent = 'Open this page from an https:// address to enable the gyroscope.';
renderCarousel();
loadPanorama();
requestAnimationFrame(frame);
})();
